name: Scheduled engine production

on:
  schedule:
    # Delivery may be late: each cycle reconstructs all missing durable slots.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [recover, morning, ptax, treasury, cvm, intraday, daily, monthly, discovery, reconcile]
        default: recover

permissions:
  contents: read

concurrency:
  group: fin-ingestion-operations
  queue: max
  cancel-in-progress: false

jobs:
  execute:
    if: vars.ENGINE_ENABLED == 'true' && vars.ENGINE_RELEASE_SHA != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      BRAPI_API_KEY: ${{ secrets.BRAPI_API_KEY }}
      PROVIDER_MONTHLY_CREDITS: ${{ vars.PROVIDER_MONTHLY_CREDITS || '{"brapi":1000}' }}
      INTRADAY_ENABLED: ${{ vars.ENGINE_INTRADAY_ENABLED || 'false' }}
      INTRADAY_TICKERS: ${{ vars.ENGINE_INTRADAY_TICKERS || '["PETR4"]' }}
      CVM_CNPJS: ${{ vars.ENGINE_CVM_CNPJS || '["33000167000101"]' }}
      INGESTION_ENV: production
      DISTRIBUTED_SOURCE_CONTROLS: 'true'
      PYTHONUNBUFFERED: '1'
      RAW_LANDING_BACKEND: local
      RAW_LANDING_DIR: data/bronze
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.ENGINE_RELEASE_SHA }}
      - name: Pin runtime receipt to the deployed source
        run: echo "ENGINE_EXECUTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --python 3.12 --frozen --no-dev
      - name: Execute the due source profile
        env:
          MANUAL_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          PROFILE="${MANUAL_PROFILE:-recover}"
          if [ "$PROFILE" = recover ]; then
            uv run --frozen --no-dev python -m fin_ingestion.operations.reliable_runtime
          else
            uv run --frozen --no-dev python -m fin_ingestion.operations.production "$PROFILE"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-runtime-${{ github.run_id }}
          path: |
            data/deployment.json
            data/runtime/
            dbt/target/run_results.json
            dbt/logs/dbt.log
            data/bronze/
          retention-days: 7
          if-no-files-found: warn
