name: CI, Quality Audit & Scheduled Maintenance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Seg-Sex CVM Descoberta de Demonstrativos ITR/DFP (06:00 BRT = 09:00 UTC)
    - cron: '0 9 * * 1-5'
    # Seg-Sex FIIs Informes & Eventos (12:00 BRT = 15:00 UTC)
    - cron: '0 15 * * 1-5'
    # Seg-Sex Fechamento Diário de Mercado B3, Proventos e dbt (18:00 BRT = 21:00 UTC)
    - cron: '0 21 * * 1-5'
    # Domingo à noite para reconciliação e enriquecimento cadastral (20:00 BRT = 23:00 UTC)
    - cron: '0 23 * * 0'
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação operacional a executar'
        required: true
        type: choice
        options:
          - 'backfill_stage1'
          - 'backfill_stage2'
          - 'daily_market'
          - 'quarterly_cvm'
          - 'monthly_fii'
          - 'macro_bcb'
          - 'queue_reconcile'
          - 'queue_status'
          - 'enrich_metadata'
          - 'compute_analytics'
          - 'test_sources'
        default: 'daily_market'
      tickers:
        description: 'Tickers específicos (opcional, separados por vírgula)'
        required: false
        default: ''

jobs:
  test:
    name: Code Quality & Automated Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv (Fast Python Package Manager)
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --frozen || uv sync

      - name: Run Test Suite
        run: uv run pytest tests/ -v

  ops-execution:
    name: Execute Ingestion Maintenance
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      DISTRIBUTED_SOURCE_CONTROLS: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --frozen || uv sync

      - name: Verify Shared Redis Protection
        run: |
          uv run python - <<'PYREDIS'
          import asyncio
          import os
          from uuid import uuid4
          from redis.asyncio import Redis
          from fin_ingestion.core.distributed_controls import DistributedSourceControls

          async def verify():
              if not os.environ.get("REDIS_URL", "").startswith("rediss://"):
                  raise RuntimeError("Production ingestion requires a TLS Redis URL")
              redis = Redis.from_url(os.environ["REDIS_URL"], socket_connect_timeout=5, socket_timeout=5)
              controls = DistributedSourceControls(redis, "deploy-check:" + uuid4().hex, 2, 5)
              try:
                  await redis.ping()
                  epoch = await controls.before_request()
                  await controls.after_request(epoch, success=True)
                  print("Shared Redis connectivity and atomic protection verified")
              finally:
                  await redis.delete(controls.bucket_key, controls.breaker_key)
                  await redis.aclose()

          asyncio.run(verify())
          PYREDIS

      - name: Execute Schedule Action
        run: |
          ACTION="${{ github.event.inputs.action }}"
          CRON_TRIGGER="${{ github.event.schedule }}"
          
          if [ -n "$ACTION" ]; then
            echo "Executando ação manual: $ACTION"
            case "$ACTION" in
              backfill_stage1)
                TICKERS_ARG=""
                [ -n "${{ github.event.inputs.tickers }}" ] && TICKERS_ARG="--tickers ${{ github.event.inputs.tickers }}"
                uv run fin-ingestion backfill-history --stage 1 $TICKERS_ARG
                uv run fin-ingestion compute-analytics
                uv run fin-ingestion dbt-run --models "staging intermediate marts"
                ;;
              backfill_stage2)
                uv run fin-ingestion backfill-history --stage 2
                uv run fin-ingestion compute-analytics
                uv run fin-ingestion dbt-run --models "staging intermediate marts"
                ;;
              daily_market)
                TICKERS_ARG=""
                [ -n "${{ github.event.inputs.tickers }}" ] && TICKERS_ARG="--tickers ${{ github.event.inputs.tickers }}"
                uv run fin-ingestion collect --pipeline daily $TICKERS_ARG
                uv run fin-ingestion compute-analytics
                uv run fin-ingestion dbt-run --models "staging intermediate marts"
                ;;
              quarterly_cvm)
                uv run fin-ingestion collect --pipeline quarterly
                ;;
              monthly_fii)
                uv run fin-ingestion collect --pipeline monthly
                ;;
              macro_bcb)
                uv run fin-ingestion collect --pipeline macro
                ;;
              queue_reconcile)
                uv run fin-ingestion queue-reconcile
                ;;
              queue_status)
                uv run fin-ingestion queue-status
                ;;
              enrich_metadata)
                uv run fin-ingestion enrich-metadata --limit 100
                ;;
              compute_analytics)
                uv run fin-ingestion compute-analytics
                ;;
              test_sources)
                uv run fin-ingestion test-sources
                ;;
            esac
          elif [ "$CRON_TRIGGER" = "0 21 * * 1-5" ]; then
            echo "Executando fechamento diário de mercado B3 às 18:00 BRT (21:00 UTC)"
            uv run fin-ingestion collect --pipeline daily
            uv run fin-ingestion compute-analytics
            uv run fin-ingestion dbt-run --models "staging intermediate marts"
          elif [ "$CRON_TRIGGER" = "0 9 * * 1-5" ]; then
            echo "Executando descoberta diária de demonstrativos CVM (Seg-Sex)"
            uv run fin-ingestion collect --pipeline quarterly
          elif [ "$CRON_TRIGGER" = "0 15 * * 1-5" ]; then
            echo "Executando coleta de informes e eventos de FIIs (Seg-Sex)"
            uv run fin-ingestion collect --pipeline monthly
          elif [ "$CRON_TRIGGER" = "0 23 * * 0" ]; then
            echo "Executando reconciliação semanal e enriquecimento cadastral (Domingo)"
            uv run fin-ingestion queue-reconcile
            uv run fin-ingestion enrich-metadata --limit 100
          fi

      - name: Execution Summary
        if: always()
        run: |
          echo "### Ingestion Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
