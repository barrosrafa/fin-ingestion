name: CI, Quality Audit & Scheduled Maintenance

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main, "codex/**"]
  schedule:
    # Seg-Sex CVM Descoberta de Demonstrativos ITR/DFP (06:00 BRT = 09:00 UTC)
    - cron: '0 9 * * 1-5'
    # Seg-Sex FIIs Informes & Eventos (12:00 BRT = 15:00 UTC)
    - cron: '0 15 * * 1-5'
    # Seg-Sex Fechamento Diário de Mercado B3, Proventos e dbt (19:00 BRT = 22:00 UTC)
    - cron: '0 22 * * 1-5'
    # Domingo à noite para reconciliação e enriquecimento cadastral (20:00 BRT = 23:00 UTC)
    - cron: '0 23 * * 0'
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação operacional a executar'
        required: true
        type: choice
        options:
          - 'backfill_stage1'
          - 'backfill_stage2'
          - 'daily_market'
          - 'quarterly_cvm'
          - 'monthly_fii'
          - 'macro_bcb'
          - 'queue_reconcile'
          - 'queue_status'
          - 'enrich_metadata'
          - 'compute_analytics'
          - 'test_sources'
        default: 'daily_market'
      tickers:
        description: 'Tickers específicos (opcional, separados por vírgula)'
        required: false
        default: ''

jobs:
  test:
    name: Code Quality & Automated Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_URL: redis://127.0.0.1:6379/0
      DATABASE_URL: postgresql://unused@127.0.0.1:1/unused
      DATABASE_URL_ASYNC: postgresql://unused@127.0.0.1:1/unused
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv (Fast Python Package Manager)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --python 3.12 --frozen

      - name: Run Test Suite
        run: uv run pytest tests/ -v

      - name: Run Ruff
        run: uv run ruff check .

  ops-execution:
    name: Execute Ingestion Maintenance
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: fin-ingestion-operations
      cancel-in-progress: false

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      DISTRIBUTED_SOURCE_CONTROLS: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --python 3.12 --frozen

      - name: Verify Shared Redis Protection
        run: |
          uv run python - <<'PYREDIS'
          import asyncio
          import os
          from uuid import uuid4
          from redis.asyncio import Redis
          from fin_ingestion.core.distributed_controls import DistributedSourceControls

          async def verify():
              if not os.environ.get("REDIS_URL", "").startswith("rediss://"):
                  raise RuntimeError("Production ingestion requires a TLS Redis URL")
              redis = Redis.from_url(os.environ["REDIS_URL"], socket_connect_timeout=5, socket_timeout=5)
              controls = DistributedSourceControls(redis, "deploy-check:" + uuid4().hex, 2, 5)
              try:
                  await redis.ping()
                  epoch = await controls.before_request()
                  await controls.after_request(epoch, success=True)
                  print("Shared Redis connectivity and atomic protection verified")
              finally:
                  await redis.delete(controls.bucket_key, controls.breaker_key)
                  await redis.aclose()

          asyncio.run(verify())
          PYREDIS

      - name: Execute Schedule Action
        env:
          ACTION: ${{ github.event.inputs.action }}
          CRON_TRIGGER: ${{ github.event.schedule }}
          INPUT_TICKERS: ${{ github.event.inputs.tickers }}
        run: |
          set -euo pipefail
          TICKERS_ARGS=()
          if [ -n "$INPUT_TICKERS" ]; then
            TICKERS_ARGS=(--tickers "$INPUT_TICKERS")
          fi
          
          if [ -n "$ACTION" ]; then
            echo "Executando ação manual: $ACTION"
            case "$ACTION" in
              backfill_stage1)
                uv run fin-ingestion backfill-history --stage 1 "${TICKERS_ARGS[@]}"
                uv run fin-ingestion compute-analytics
                uv run fin-ingestion dbt-run --models "staging intermediate marts"
                ;;
              backfill_stage2)
                uv run fin-ingestion backfill-history --stage 2
                uv run fin-ingestion compute-analytics
                uv run fin-ingestion dbt-run --models "staging intermediate marts"
                ;;
              daily_market)
                uv run fin-ingestion collect --pipeline daily "${TICKERS_ARGS[@]}"
                uv run fin-ingestion compute-analytics
                uv run fin-ingestion dbt-run --models "staging intermediate marts"
                ;;
              quarterly_cvm)
                uv run fin-ingestion collect --pipeline quarterly
                ;;
              monthly_fii)
                uv run fin-ingestion collect --pipeline monthly
                ;;
              macro_bcb)
                uv run fin-ingestion collect --pipeline macro
                ;;
              queue_reconcile)
                uv run fin-ingestion queue-reconcile
                ;;
              queue_status)
                uv run fin-ingestion queue-status
                ;;
              enrich_metadata)
                uv run fin-ingestion enrich-metadata --limit 100
                ;;
              compute_analytics)
                uv run fin-ingestion compute-analytics
                ;;
              test_sources)
                uv run fin-ingestion test-sources
                ;;
            esac
          elif [ "$CRON_TRIGGER" = "0 22 * * 1-5" ]; then
            echo "Executando fechamento diário de mercado B3 às 19:00 BRT (22:00 UTC)"
            uv run fin-ingestion collect --pipeline daily
            uv run fin-ingestion compute-analytics
            uv run fin-ingestion dbt-run --models "staging intermediate marts"
          elif [ "$CRON_TRIGGER" = "0 9 * * 1-5" ]; then
            echo "Executando descoberta diária de demonstrativos CVM (Seg-Sex)"
            uv run fin-ingestion collect --pipeline quarterly
          elif [ "$CRON_TRIGGER" = "0 15 * * 1-5" ]; then
            echo "Executando coleta de informes e eventos de FIIs (Seg-Sex)"
            uv run fin-ingestion collect --pipeline monthly
          elif [ "$CRON_TRIGGER" = "0 23 * * 0" ]; then
            echo "Executando reconciliação semanal e enriquecimento cadastral (Domingo)"
            uv run fin-ingestion queue-reconcile
            uv run fin-ingestion enrich-metadata --limit 100
          fi

      - name: Upload dbt diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dbt-results-${{ github.run_id }}
          path: |
            dbt/target/run_results.json
            dbt/logs/dbt.log
          if-no-files-found: ignore

      - name: Execution Summary
        if: always()
        run: |
          echo "### Ingestion Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
