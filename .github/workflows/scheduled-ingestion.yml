name: CI, Quality Audit & Scheduled Maintenance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Seg-Sex no fechamento de pregão consolidado (18:30 BRT = 21:30 UTC)
    - cron: '30 21 * * 1-5'
    # Domingo à noite para reconciliação e enriquecimento cadastral (20:00 BRT = 23:00 UTC)
    - cron: '0 23 * * 0'
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação operacional a executar'
        required: true
        type: choice
        options:
          - 'daily_market'
          - 'queue_reconcile'
          - 'queue_status'
          - 'enrich_metadata'
          - 'compute_analytics'
          - 'test_sources'
        default: 'daily_market'
      tickers:
        description: 'Tickers específicos (opcional, separados por vírgula)'
        required: false
        default: ''

jobs:
  test:
    name: Code Quality & Automated Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv (Fast Python Package Manager)
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --frozen || uv sync

      - name: Run Test Suite
        run: uv run pytest tests/ -v

  ops-execution:
    name: Execute Ingestion Maintenance
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --frozen || uv sync

      - name: Execute Schedule Action
        run: |
          ACTION="${{ github.event.inputs.action }}"
          CRON_TRIGGER="${{ github.event.schedule }}"
          
          if [ -n "$ACTION" ]; then
            echo "Executando ação manual: $ACTION"
            case "$ACTION" in
              daily_market)
                TICKERS_ARG=""
                [ -n "${{ github.event.inputs.tickers }}" ] && TICKERS_ARG="--tickers ${{ github.event.inputs.tickers }}"
                uv run fin-ingestion collect --pipeline daily $TICKERS_ARG
                ;;
              queue_reconcile)
                uv run fin-ingestion queue-reconcile
                ;;
              queue_status)
                uv run fin-ingestion queue-status
                ;;
              enrich_metadata)
                uv run fin-ingestion enrich-metadata --limit 100
                ;;
              compute_analytics)
                uv run fin-ingestion compute-analytics
                ;;
              test_sources)
                uv run fin-ingestion test-sources
                ;;
            esac
          elif [ "$CRON_TRIGGER" = "30 21 * * 1-5" ]; then
            echo "Executando fechamento diário de mercado (Seg-Sex)"
            uv run fin-ingestion collect --pipeline daily
            uv run fin-ingestion compute-analytics
          elif [ "$CRON_TRIGGER" = "0 23 * * 0" ]; then
            echo "Executando reconciliação semanal e enriquecimento cadastral (Domingo)"
            uv run fin-ingestion queue-reconcile
            uv run fin-ingestion enrich-metadata --limit 100
          fi

      - name: Execution Summary
        if: always()
        run: |
          echo "### Ingestion Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
