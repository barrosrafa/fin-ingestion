fin:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      user: "{{ env_var('DBT_USER', 'postgres') }}"
      password: "{{ env_var('DBT_PASSWORD', 'postgres') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      dbname: "{{ env_var('DBT_DBNAME', 'neondb') }}"
      schema: public
      threads: 4
      keepalives_idle: 0
      connect_timeout: 20
      retries: 5
      sslmode: "{{ env_var('DBT_SSLMODE', 'require') }}"
    prod:
      type: postgres
      host: "{{ env_var('DBT_HOST') }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      dbname: "{{ env_var('DBT_DBNAME', 'neondb') }}"
      schema: public
      threads: 8
      keepalives_idle: 0
      connect_timeout: 20
      retries: 5
      sslmode: require
